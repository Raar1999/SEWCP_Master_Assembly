<text x="14.000" y="18.000" font-size="2.6" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">NOTES:</text>
<text x="14.000" y="22.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">1. HARD ANODIZE ALL OVER EXCEPT MASKED ZONES M1–M5 (spec/01 §8, ECR-D-004).</text>
<text x="14.000" y="26.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">2. M1 RF LAND 93°–117°: MASK; ALODINE 1200 ONLY; Ra ≤ 0.8 (CP-D18, spec/08 §7).</text>
<text x="14.000" y="30.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">3. M2 LOCATOR COUNTERBORES + M4 THREADS (BOTH FACES): MASK (spec/01 §7 STEP 13).</text>
<text x="14.000" y="34.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">4. M3 VACUUM-PORT SEALING FACE + O-RING LAND: MASK (CP-IF-5).</text>
<text x="14.000" y="38.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">5. M4 16× CHOKE PADS + CP-D26 COUNTERBORE FLOORS: MASK — BELLEVILLE SLIP, ECR-D-004.</text>
<text x="14.000" y="42.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">6. M5 CHANNEL INTERIOR AND PORT POCKETS: MASK (spec/01 §7 STEP 13).</text>
<text x="14.000" y="46.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">7. RTD PORTS CROSS-VENTED PER DR-6; VENTS ⌀1.7 INTO ADJACENT CHOKE-SIDE RELIEF (CP-IF-9).</text>
