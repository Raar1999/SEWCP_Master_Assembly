<text x="14.000" y="42.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">6. SPRING PLUNGER PRELOAD 7.5 ±2.5 N, TRAVEL 2.0 MIN (TR-D05/06) — HW IS SPEC-ONLY (BOM).</text>
<text x="14.000" y="46.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">7. VENT SLOT MUST ALIGN WITH PLATE CROSS-VENT AT INSTALL (spec/09 §10 STEP 7).</text>
