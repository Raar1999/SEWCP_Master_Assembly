<text x="14.000" y="22.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">1. INTERPRET PER ASME Y14.5-2018. UNITS mm. UNLESS NOTED: X.X ±0.2, X.XX ±0.05.</text>
<text x="14.000" y="26.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">2. BREAK ALL EDGES 0.2-0.4 UNLESS NOTED. NO BURRS.</text>
<text x="14.000" y="30.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">3. VENT ALL BLIND HOLES IN VACUUM-EXPOSED PARTS PER DR-6 (spec/00).</text>
<text x="14.000" y="34.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">4. PROVENANCE: EVERY DIMENSION TRACES PER THE SIDECAR PROVENANCE FILE OF THIS DRAWING (AIEF).</text>
<text x="14.000" y="38.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">5. 0.50 C10100 OFHC STRIP; SILVER 8–13 µm DIRECTLY ON COPPER — NO NICKEL (RS-D08/09, DR-7).</text>
<text x="14.000" y="42.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">6. FORM ON R20 MANDREL; ANNEAL; FLATTEN PADS 0.05 TIR; 4-WIRE ≤ 3 mΩ.</text>
<text x="14.000" y="46.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">7. HOLES COINCIDENT WITH CP-IF-8 TAPS: 29.94 CTRS AT PAD STATION 9.82 FROM END (ECR-D-013 DISPOSITION A, DEC-01).</text>
<text x="14.000" y="50.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">8. SEWCP-904 DEPOSITION SHROUD: NO DIMENSIONAL AUTHORITY IN spec/08 — CARRIED (NOT DRAWN).</text>
