<text x="14.000" y="18.000" font-size="2.6" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">NOTES:</text>
<text x="14.000" y="22.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">1. INTERPRET PER ASME Y14.5-2018. UNITS mm. UNLESS NOTED: X.X ±0.2, X.XX ±0.05.</text>
<text x="14.000" y="26.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">2. BREAK ALL EDGES 0.2-0.4 UNLESS NOTED. NO BURRS.</text>
<text x="14.000" y="30.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">3. VENT ALL BLIND HOLES IN VACUUM-EXPOSED PARTS PER DR-6 (spec/00).</text>
<text x="14.000" y="34.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">4. PROVENANCE: EVERY DIMENSION TRACES PER THE SIDECAR PROVENANCE FILE OF THIS DRAWING (AIEF).</text>
<text x="14.000" y="38.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">5. PLATE-HUNG HANGER PER ECR-Q-012 DISPOSITION (DEC-02 + ADDENDUM, APR-031/032): MOUNTS TO THE RF-HOT COOLING PLATE — NOT TO GROUND (RF-IF-3).</text>
<text x="14.000" y="42.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">6. BEARS ON THE STRAP TOP FACE AT 8.25: RS-D04 MID-PLANE = 8.0 EXACTLY (SB-D01).</text>
<text x="14.000" y="46.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">7. ALL SURFACES ≥ 8.0 FROM THE GROUNDED BASE PLATE (SB-D04) — MINIMUM AT THE CHEEK TIPS.</text>
<text x="14.000" y="50.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">8. M6 × 16 SHCS, 6.0 N·m INTO THE CP BRACKET TAPS (r=150, 88°/122°); GRIP 5.0, ENGAGEMENT 11.</text>
<text x="14.000" y="54.000" font-size="2.2" font-family="ISOCPEUR, Consolas, monospace" text-anchor="start">9. CNC ONE PIECE FROM 6061-T6 12.7 PLATE; ALODINE 1200 (CONDUCTIVE) — NOT ANODIZE.</text>
